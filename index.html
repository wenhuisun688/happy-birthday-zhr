<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日快乐 张慧冉</title>

    <!-- 引入艺术字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Montserrat:wght@700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* 全局样式复位 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5edff 0%, #e8d7ff 50%, #eedfff 100%);
            color: #4a2e6b;
            user-select: none;
            -webkit-user-select: none;
            animation: fadeInBody 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: opacity;
        }

        @keyframes fadeInBody { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* ---------------- 🎵 5.jpg 右上角圆形匀速旋转音乐按钮 ---------------- */
        .music-disc-btn {
            position: fixed; top: 20px; right: 20px; width: 50px; height: 50px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 24px rgba(120, 70, 180, 0.25);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; cursor: pointer; overflow: hidden;
            touch-action: manipulation;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .music-disc-btn:active { transform: scale(0.9); }
        .music-avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        .music-disc-btn.playing .music-avatar-img { animation: rotateDisc 4s linear infinite; }
        .music-disc-btn.paused { opacity: 0.65; }
        @keyframes rotateDisc { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 点击微光粒子特效 */
        .click-particle {
            position: fixed; pointer-events: none; z-index: 9998; font-size: 16px; user-select: none;
            animation: clickParticleAnim 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }
        @keyframes clickParticleAnim {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; }
        }

        /* 背景流光与粒子 */
        .bg-glow-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(55px); opacity: 0.45; animation: orbFloat 8s ease-in-out infinite alternate; }
        .glow-orb-1 { width: 240px; height: 240px; background: #d8b4fe; bottom: -30px; right: -20px; animation-duration: 7s; }
        .glow-orb-2 { width: 280px; height: 280px; background: #f472b6; bottom: -50px; right: -50px; animation-duration: 8.5s; animation-delay: -3s; }
        .glow-orb-3 { width: 180px; height: 180px; background: #c084fc; bottom: 50px; right: 30px; animation-duration: 6s; animation-delay: -1.5s; }
        @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-22px, -18px) scale(1.12); } 100% { transform: translate(15px, -28px) scale(0.92); } }

        .bg-particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        /* 屏幕通用 */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; z-index: 10; opacity: 0; visibility: hidden;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s; overflow-y: auto;
        }
        .screen.active { opacity: 1; visibility: visible; }

        /* ---------------- 第一屏：欢迎卡片与 1.jpg ---------------- */
        .welcome-card {
            position: relative; background: rgba(255, 255, 255, 0.68); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.95); border-radius: 28px; padding: 48px 20px 60px 20px;
            box-shadow: 0 15px 35px rgba(135, 90, 185, 0.15); text-align: center; width: 100%; max-width: 360px;
            animation: cardAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatCard 4s ease-in-out infinite 1s;
        }
        @keyframes cardAppear { 0% { opacity: 0; transform: translateY(12px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .welcome-title { font-size: 20px; font-weight: 700; color: #6a4891; margin-bottom: 8px; letter-spacing: 2px; }
        .welcome-name {
            font-size: 44px; font-weight: 900; letter-spacing: 3px; display: block; margin-top: 6px;
            background: linear-gradient(135deg, #2E0854 0%, #6B06C3 50%, #B800FF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 12px rgba(107, 6, 195, 0.3));
        }
        .sub-note { position: absolute; bottom: 20px; right: 24px; font-size: 11.5px; font-weight: 700; color: #8b68aa; opacity: 0.9; }

        .tap-hint {
            position: absolute; bottom: 40px; font-size: 14.5px; font-weight: 700; color: #7b53a6; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; gap: 10px; animation: pulseHint 2s infinite;
        }
        .hint-avatar { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; box-shadow: 0 4px 12px rgba(123, 83, 166, 0.35); border: 2px solid rgba(255, 255, 255, 0.95); display: inline-block; }

        /* ---------------- 第二屏：计时卡片与 2.jpg ---------------- */
        .timer-card {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.95); border-radius: 28px; padding: 28px 16px;
            box-shadow: 0 15px 35px rgba(135, 90, 185, 0.15); text-align: center; width: 100%; max-width: 360px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .section-block { display: flex; flex-direction: column; align-items: center; }
        .timer-header { font-size: 15px; font-weight: 900; color: #4a207a; letter-spacing: 1.5px; margin-bottom: 8px; }
        .flip-counter { display: flex; align-items: flex-start; justify-content: center; gap: 3px; width: 100%; perspective: 400px; }
        .counter-group { display: flex; flex-direction: column; align-items: center; }
        .digits { display: flex; gap: 2px; }
        .digit-card {
            position: relative; width: 18px; height: 28px; background: #ffffff; border-radius: 5px;
            box-shadow: 0 4px 10px rgba(110, 60, 160, 0.16); display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 800; color: #3c1a63; font-family: 'Montserrat', sans-serif; font-variant-numeric: tabular-nums;
            overflow: hidden; backface-visibility: hidden; transform-style: preserve-3d;
        }
        .digit-card::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1.5px; background: rgba(130, 80, 180, 0.2); }
        .digit-card.flip-tick { animation: cardFlipAnim 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes cardFlipAnim { 0% { transform: rotateX(0deg); } 50% { transform: rotateX(-90deg); opacity: 0.6; } 100% { transform: rotateX(0deg); opacity: 1; } }

        .colon { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 800; color: #7b53a6; line-height: 28px; margin: 0 1px; }
        .group-label { font-size: 8.5px; font-family: 'Montserrat', sans-serif; font-weight: 800; color: #8b68aa; margin-top: 4px; text-transform: uppercase; }
        .divider { width: 85%; height: 1px; border-top: 1.5px dashed rgba(160, 120, 200, 0.3); margin: 0 auto; }

        .precise-card { background: rgba(255, 255, 255, 0.85); border-radius: 16px; padding: 8px 14px; border: 1px solid rgba(200, 170, 240, 0.5); box-shadow: 0 4px 15px rgba(130, 90, 180, 0.08); width: 100%; }
        .gradient-flow-num {
            font-size: 19px; font-weight: 900; font-family: 'Montserrat', sans-serif; font-variant-numeric: tabular-nums;
            background: linear-gradient(120deg, #3c1a63 0%, #8b41e0 35%, #d946ef 70%, #3c1a63 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: flowGradient 2.5s linear infinite; display: inline-block;
        }

        .memory-entry-btn {
            margin-top: 6px; padding: 12px 24px; border-radius: 22px;
            background: linear-gradient(135deg, #7b39ed 0%, #a855f7 100%);
            color: #ffffff; font-weight: 800; font-size: 15px; letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(123, 57, 237, 0.35); cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center; gap: 10px; animation: pulseHint 2s infinite;
        }
        .memory-entry-btn:active { transform: scale(0.94); }
        .btn-avatar { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; border: 1.5px solid rgba(255, 255, 255, 0.95); box-shadow: 0 3px 8px rgba(0,0,0,0.18); display: inline-block; vertical-align: middle; }

        /* ---------------- 第三屏：回忆相册与 3.jpg / 6.jpg ---------------- */
        #screen3 { padding: 16px; overflow-y: auto; }
        .gallery-wrapper {
            position: relative; width: 100%; min-height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; max-width: 520px; margin: 0 auto;
            transition: justify-content 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .gallery-wrapper.searched { justify-content: flex-start; padding-top: 20px; padding-bottom: 30px; }

        /* 💖 右下角惊喜小按钮 */
        .corner-heart-btn {
            position: absolute; bottom: 24px; right: 12px; width: 46px; height: 46px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.95); box-shadow: 0 8px 22px rgba(130, 70, 180, 0.22);
            display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 50;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .corner-heart-btn:hover { transform: scale(1.18); box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35); }
        .corner-heart-btn:active { transform: scale(0.92); }

        .story-title {
            font-family: 'Great Vibes', 'Dancing Script', cursive; font-size: 27px; font-weight: 700;
            background: linear-gradient(135deg, #6b21a8 0%, #a855f7 50%, #d946ef 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 14px; text-align: center; letter-spacing: 1px; animation: storyBreathing 3s ease-in-out infinite;
        }
        @keyframes storyBreathing {
            0%, 100% { opacity: 0.75; transform: scale(0.98); filter: drop-shadow(0 2px 4px rgba(124, 58, 237, 0.15)); }
            50% { opacity: 1; transform: scale(1.03); filter: drop-shadow(0 4px 12px rgba(192, 132, 252, 0.6)); }
        }

        .nav-header {
            width: 100%; padding: 10px 14px; display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 32px; border: 1.5px solid rgba(255, 255, 255, 0.95); box-shadow: 0 12px 30px rgba(120, 70, 180, 0.15);
            z-index: 20; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .back-icon-btn {
            width: 38px; height: 38px; border-radius: 50%; background: #ffffff;
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: #5b21b6;
            box-shadow: 0 4px 12px rgba(120, 80, 180, 0.12); cursor: pointer; flex-shrink: 0; font-weight: 800;
        }

        .search-box-container {
            flex: 1; display: flex; align-items: center; background: #ffffff; border-radius: 22px;
            padding: 0 8px 0 10px; height: 46px; box-shadow: 0 2px 10px rgba(120, 80, 180, 0.06);
            border: 1.5px solid rgba(190, 150, 230, 0.3); transition: border-color 0.3s;
        }
        .search-box-container:focus-within { border-color: #8b5cf6; }
        .search-custom-icon { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; margin-right: 8px; flex-shrink: 0; border: 1.5px solid rgba(190, 150, 230, 0.5); }
        .search-input { width: 100%; border: none; outline: none; background: transparent; font-size: 13.5px; font-weight: 700; color: #4c1d95; }
        .search-input::placeholder { color: #a78bfa; font-weight: 500; }

        .search-submit-btn {
            padding: 0 12px; height: 32px; border-radius: 16px; background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: #ffffff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 3px 10px rgba(124, 58, 237, 0.3); flex-shrink: 0; transition: transform 0.2s;
        }
        .search-submit-btn:active { transform: scale(0.92); }

        .add-plus-btn {
            width: 40px; height: 40px; border-radius: 50%; background: #ffffff; color: #7c3aed;
            display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2); cursor: pointer; flex-shrink: 0; transition: transform 0.2s;
        }
        .add-plus-btn:active { transform: scale(0.9); }

        .gallery-content { width: 100%; flex: 1; padding-top: 16px; margin-top: 8px; }
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        .photo-card {
            position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
            background: #e9d5ff; box-shadow: 0 6px 18px rgba(110, 60, 160, 0.12); border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease; cursor: pointer;
        }
        .photo-card:hover { transform: scale(1.04); box-shadow: 0 12px 30px rgba(124, 58, 237, 0.25); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-tag {
            position: absolute; bottom: 6px; right: 8px; background: rgba(46, 16, 101, 0.65);
            backdrop-filter: blur(8px); color: #ffffff; font-size: 10px; font-weight: 800;
            padding: 2px 7px; border-radius: 10px; font-family: 'Montserrat', sans-serif;
        }

        .empty-hint { text-align: center; color: #8b5cf6; font-weight: 700; font-size: 14px; margin-top: 40px; line-height: 1.8; }

        /* ---------------- 灯箱大图预览层 ---------------- */
        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 10, 60, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px;
            opacity: 0; visibility: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lightbox-overlay.show { opacity: 1; visibility: visible; }
        .lightbox-img {
            max-width: 100%; max-height: 90vh; width: auto; height: auto; object-fit: contain; border-radius: 18px;
            box-shadow: 0 25px 60px rgba(50, 10, 90, 0.5); border: 2px solid rgba(255, 255, 255, 0.85);
            transform: scale(0.85); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .lightbox-overlay.show .lightbox-img { transform: scale(1); }

        /* ---------------- 上传弹窗与照片拖拽/选择框 ---------------- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 10, 60, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-card {
            background: #faf6ff; border-radius: 28px; border: 1.5px solid rgba(255, 255, 255, 0.9);
            width: 100%; max-width: 360px; padding: 22px 20px; box-shadow: 0 20px 40px rgba(70, 20, 120, 0.25);
            display: flex; flex-direction: column; gap: 16px; transform: translateY(20px); transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-card { transform: translateY(0); }
        .modal-title-bar { display: flex; justify-content: space-between; align-items: center; }
        .modal-title-wrapper { display: flex; align-items: center; gap: 8px; }
        .modal-title { font-size: 18px; font-weight: 900; color: #4c1d95; letter-spacing: 1px; }
        .modal-title-avatar { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1.5px solid rgba(168, 85, 247, 0.5); display: inline-block; vertical-align: middle; }
        .close-modal-btn { font-size: 18px; font-weight: 800; color: #9333ea; cursor: pointer; padding: 4px; }

        .form-row { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .form-label { font-size: 13px; font-weight: 800; color: #6b21a8; letter-spacing: 0.5px; }

        .wheel-picker-wrapper { position: relative; width: 100%; height: 130px; background: transparent; border: none; display: flex; overflow: hidden; box-shadow: none; }
        .wheel-highlight-bar { position: absolute; top: 48px; left: 0; right: 0; height: 34px; background: rgba(225, 210, 250, 0.55); border-radius: 12px; pointer-events: none; z-index: 1; }
        .wheel-picker-wrapper::before, .wheel-picker-wrapper::after { content: ''; position: absolute; left: 0; width: 100%; height: 48px; pointer-events: none; z-index: 2; }
        .wheel-picker-wrapper::before { top: 0; background: linear-gradient(to bottom, #faf6ff 15%, rgba(250, 246, 255, 0)); }
        .wheel-picker-wrapper::after { bottom: 0; background: linear-gradient(to top, #faf6ff 15%, rgba(250, 246, 255, 0)); }
        .wheel-col { flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; z-index: 3; padding: 48px 0; cursor: grab; scroll-behavior: smooth; }
        .wheel-col:active { cursor: grabbing; }
        .wheel-col::-webkit-scrollbar { display: none; }
        .wheel-item { height: 34px; line-height: 34px; text-align: center; font-size: 15px; font-weight: 800; color: #4c1d95; scroll-snap-align: center; font-family: 'Montserrat', 'Noto Sans SC', sans-serif; will-change: transform, opacity; transform: translateZ(0); cursor: pointer; }

        /* 本地直传图片上传框 */
        .upload-dropzone {
            width: 100%; height: 100px; border-radius: 16px; border: 2px dashed rgba(168, 85, 247, 0.5);
            background: rgba(245, 237, 255, 0.6); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; position: relative;
            overflow: hidden; transition: all 0.3s ease;
        }
        .upload-dropzone:hover { background: rgba(237, 222, 255, 0.85); border-color: #8b5cf6; }
        .upload-icon-text { font-size: 13px; font-weight: 700; color: #7c3aed; text-align: center; }
        .upload-preview-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; }

        .submit-upload-btn { width: 100%; height: 44px; border-radius: 14px; border: none; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); color: #ffffff; font-weight: 900; font-size: 15px; letter-spacing: 1px; box-shadow: 0 6px 18px rgba(124, 58, 237, 0.3); cursor: pointer; margin-top: 2px; }
        .submit-upload-btn:active { transform: scale(0.97); }

        @keyframes flowGradient { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes pulseHint { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

        @media (max-width: 768px) {
            .bg-glow-container { display: none !important; }
            .welcome-card, .timer-card { max-width: 92vw; padding-left: 12px; padding-right: 12px; }
            .digit-card { width: 17px; height: 27px; font-size: 15px; }
            .colon { font-size: 14px; line-height: 27px; }
            .story-title { font-size: 23px; margin-bottom: 10px; }
            .music-disc-btn { top: 16px; right: 16px; width: 44px; height: 44px; }
        }
    </style>
</head>
<body>

    <!-- 🎵 5.jpg 音乐按钮 -->
    <div class="music-disc-btn paused" id="musicBtn" title="开关背景音乐">
        <img src="5.jpg" class="music-avatar-img" alt="5">
    </div>
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <!-- 背景粒子特效 -->
    <div class="bg-glow-container">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
        <div class="glow-orb glow-orb-3"></div>
    </div>
    <div class="bg-particles" id="particles"></div>

    <!-- 第一屏 -->
    <div class="screen active" id="screen1">
        <div class="welcome-card">
            <p class="welcome-title">欢迎你！</p>
            <span class="welcome-name">生日快乐</span>
            <span class="sub-note">谨记张慧冉第19个生日</span>
        </div>
        <!-- 📷 1.jpg -->
        <div class="tap-hint">
            点击屏幕以继续
            <img src="1.jpg" class="hint-avatar" alt="1">
        </div>
    </div>

    <!-- 第二屏 -->
    <div class="screen" id="screen2">
        <div class="timer-card">
            <div class="section-block">
                <p class="timer-header">你来到这个世界已经：</p>
                <div class="flip-counter">
                    <div class="counter-group"><div class="digits"><div class="digit-card" id="y1">1</div><div class="digit-card" id="y2">9</div></div><span class="group-label">YEAR</span></div>
                    <div class="colon">:</div>
                    <div class="counter-group"><div class="digits"><div class="digit-card" id="d1">0</div><div class="digit-card" id="d2">0</div><div class="digit-card" id="d3">0</div></div><span class="group-label">DAY</span></div>
                    <div class="colon">:</div>
                    <div class="counter-group"><div class="digits"><div class="digit-card" id="h1">0</div><div class="digit-card" id="h2">0</div></div><span class="group-label">HOUR</span></div>
                    <div class="colon">:</div>
                    <div class="counter-group"><div class="digits"><div class="digit-card" id="m1">0</div><div class="digit-card" id="m2">0</div></div><span class="group-label">MINUTE</span></div>
                    <div class="colon">:</div>
                    <div class="counter-group"><div class="digits"><div class="digit-card" id="s1">0</div><div class="digit-card" id="s2">0</div></div><span class="group-label">SECOND</span></div>
                </div>
            </div>
            <div class="divider"></div>
            <div class="section-block">
                <p class="timer-header">存在这个世界上的天数：</p>
                <div class="precise-card"><span class="gradient-flow-num" id="preciseDays">0.0 天</span></div>
            </div>
            <div class="divider"></div>
            <div class="section-block">
                <p class="timer-header">你已经：</p>
                <div class="precise-card"><span class="gradient-flow-num" id="preciseAge">19.00000000 岁</span></div>
            </div>
            <!-- 📷 2.jpg -->

                开启回忆... 
                <img src="2.jpg" class="btn-avatar" alt="2">
            </div>

    </div>

    <!-- 第三屏 -->
    <div class="screen" id="screen3">
        <div class="gallery-wrapper" id="galleryWrapper">
            <!-- 💖 右下角按钮 (点击弹出 6.jpg) -->
            <div class="corner-heart-btn" id="cornerHeartBtn" title="专属惊喜">💖</div>

            <div class="story-title">Every little piece of our story</div>

            <div class="nav-header">
                <div class="back-icon-btn" id="backToPage2">‹</div>
                <div class="search-box-container">
                    <!-- 📷 3.jpg -->
                    <img src="3.jpg" class="search-custom-icon" alt="3">
                    <input type="text" class="search-input" id="searchInput" placeholder="输入日期 (如 25.2.2 或 26.2.2) 检索...">
                    <div class="search-submit-btn" id="searchSubmitBtn">搜索</div>
                </div>
                <div class="add-plus-btn" id="openUploadModalBtn">+</div>

            <div class="gallery-content" id="galleryContent" style="display: none;">
                <div class="photo-grid" id="photoGrid"></div>
                <div class="empty-hint" id="emptyHint" style="display: none;">
                    🌸 暂无该日期的回忆照片<br><span style="font-size: 12px; opacity: 0.8;">输入日期检索（支持如 25.2.2 或 26.2.2）</span>

    <!-- 通用照片放大灯箱 -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <img class="lightbox-img" id="lightboxImg" alt="大图预览">
    </div>

    <!-- 📷 6.jpg 专属大图灯箱 -->
    <div class="lightbox-overlay" id="heartLightboxOverlay">
        <img class="lightbox-img" src="6.jpg" alt="惊喜大图">
    </div>

    <!-- 上传弹窗（已恢复图片选择功能） -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <div class="modal-title-bar">
                <div class="modal-title-wrapper">
                    <span class="modal-title">添加照片</span>
                    <!-- 📷 4.jpg -->
                    <img src="4.jpg" class="modal-title-avatar" alt="4">
                </div>
                <span class="close-modal-btn" id="closeUploadModalBtn">✕</span>
            </div>

            <div class="form-row">
                <label class="form-label">1. 滑动滚筒选择绑定日期</label>
                <div class="wheel-picker-wrapper">
                    <div class="wheel-highlight-bar"></div>
                    <div class="wheel-col" id="yearWheel"></div>
                    <div class="wheel-col" id="monthWheel"></div>
                    <div class="wheel-col" id="dayWheel"></div>
                </div>
            </div>

            <div class="form-row">
                <label class="form-label">2. 选择并上传照片</label>
                <div class="upload-dropzone" id="uploadDropzone">
                    <input type="file" id="photoFileInput" accept="image/*" style="display: none;">
                    <span class="upload-icon-text" id="uploadDropzoneText">📸 点击选择或拖拽照片到这里</span>
                    <img src="" class="upload-preview-img" id="uploadPreviewImg" alt="预览">
                </div>
            </div>

            <button class="submit-upload-btn" id="savePhotoBtn">保存照片</button>
        </div>
    </div>

    <script>
        const BIRTH_DATE = new Date(2007, 6, 28, 12, 10, 0); 
        const MS_PER_DAY = 1000 * 60 * 60 * 24;
        const MS_PER_YEAR = MS_PER_DAY * 365.2425;

        // 🎵 BGM 播放与移动端兼容处理
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');
        const TARGET_VOLUME = 0.35; 
        let fadeInterval = null;
        let isMusicPlaying = false;

        function fadeInBGM() {
            clearInterval(fadeInterval);
            bgm.volume = 0;
            const playPromise = bgm.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isMusicPlaying = true;
                    musicBtn.classList.remove('paused');
                    musicBtn.classList.add('playing');
                    fadeInterval = setInterval(() => {
                        if (bgm.volume < TARGET_VOLUME - 0.02) {
                            bgm.volume = Math.min(TARGET_VOLUME, bgm.volume + 0.03);
                        } else {
                            bgm.volume = TARGET_VOLUME;
                            clearInterval(fadeInterval);
                        }
                    }, 50);
                }).catch(e => {});
            }
        }

        function fadeOutBGM() {
            clearInterval(fadeInterval);
            fadeInterval = setInterval(() => {
                if (bgm.volume > 0.03) {
                    bgm.volume = Math.max(0, bgm.volume - 0.03);
                } else {
                    bgm.volume = 0;
                    bgm.pause();
                    isMusicPlaying = false;
                    musicBtn.classList.remove('playing');
                    musicBtn.classList.add('paused');
                    clearInterval(fadeInterval);
                }
            }, 50);
        }

        function toggleBGM(e) {
            if (e) {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
            }
            if (isMusicPlaying) {
                fadeOutBGM();
            } else {
                fadeInBGM();
            }
        }

        musicBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
        musicBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
        musicBtn.addEventListener('click', toggleBGM);

        function handleFirstTouch(e) {
            if (musicBtn.contains(e.target)) return;
            if (!isMusicPlaying) fadeInBGM();
            document.removeEventListener('pointerdown', handleFirstTouch);
            document.removeEventListener('touchstart', handleFirstTouch);
        }
        document.addEventListener('pointerdown', handleFirstTouch);
        document.addEventListener('touchstart', handleFirstTouch, { passive: true });

        // 点击音效与粒子
        let audioCtx = null;
        function playCuteSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1040, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        document.addEventListener('pointerdown', (e) => {
            playCuteSound();
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (!x || !y) return;
            const icons = ['💗', '✨', '🌸', '💖', '⭐'];
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'click-particle';
                p.innerText = icons[Math.floor(Math.random() * icons.length)];
                p.style.left = x + 'px'; p.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 55 + 20;
                p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                p.style.setProperty('--dy', `${Math.sin(angle) * dist - 20}px`);
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 700);
            }
        });

        // 页面切换
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        let screen1Clicked = false;
        screen1.addEventListener('click', function() {
            if (!screen1Clicked) {
                screen1Clicked = true;
                screen1.classList.remove('active');
                setTimeout(() => { screen2.classList.add('active'); startLiveTimer(); }, 300);
            }
        });
        document.getElementById('toPage3Btn').addEventListener('click', (e) => { e.stopPropagation(); screen2.classList.remove('active'); setTimeout(() => screen3.classList.add('active'), 300); });
        document.getElementById('backToPage2').addEventListener('click', () => { screen3.classList.remove('active'); setTimeout(() => screen2.classList.add('active'), 300); });

        // 高精计时器
        function setFlipDigit(id, newChar) {
            const el = document.getElementById(id);
            if (el && el.innerText !== newChar) {
                el.innerText = newChar; el.classList.remove('flip-tick'); void el.offsetWidth; el.classList.add('flip-tick');
            }
        }
        function startLiveTimer() {
            function update() {
                const now = new Date();
                const diffMs = now - BIRTH_DATE;
                if (diffMs >= 0) {
                    let years = now.getFullYear() - BIRTH_DATE.getFullYear();
                    let birthThisYear = new Date(now.getFullYear(), BIRTH_DATE.getMonth(), BIRTH_DATE.getDate(), BIRTH_DATE.getHours(), BIRTH_DATE.getMinutes(), BIRTH_DATE.getSeconds());
                    if (now < birthThisYear) { years--; birthThisYear = new Date(now.getFullYear() - 1, BIRTH_DATE.getMonth(), BIRTH_DATE.getDate(), BIRTH_DATE.getHours(), BIRTH_DATE.getMinutes(), BIRTH_DATE.getSeconds()); }
                    const diffDaysTotal = Math.floor((now - birthThisYear) / MS_PER_DAY);
                    const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((diffMs / (1000 * 60)) % 60);
                    const seconds = Math.floor((diffMs / 1000) % 60);

                    const yStr = String(years).padStart(2, '0');
                    const dStr = String(diffDaysTotal).padStart(3, '0');
                    const hStr = String(hours).padStart(2, '0');
                    const mStr = String(minutes).padStart(2, '0');
                    const sStr = String(seconds).padStart(2, '0');

                    setFlipDigit('y1', yStr[0]); setFlipDigit('y2', yStr[1]);
                    setFlipDigit('d1', dStr[0]); setFlipDigit('d2', dStr[1]); setFlipDigit('d3', dStr[2]);
                    setFlipDigit('h1', hStr[0]); setFlipDigit('h2', hStr[1]);
                    setFlipDigit('m1', mStr[0]); setFlipDigit('m2', mStr[1]);
                    setFlipDigit('s1', sStr[0]); setFlipDigit('s2', sStr[1]);

                    document.getElementById('preciseDays').innerText = `${(diffMs / MS_PER_DAY).toFixed(1)} 天`;
                    document.getElementById('preciseAge').innerText = `${(diffMs / MS_PER_YEAR).toFixed(8)} 岁`;
                }
                requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        // 滚筒选择器
        const yearWheel = document.getElementById('yearWheel');
        const monthWheel = document.getElementById('monthWheel');
        const dayWheel = document.getElementById('dayWheel');
        const ITEM_HEIGHT = 34;
        let currentTotalDays = 0;

        function initWheelPicker() {
            yearWheel.innerHTML = '';
            for (let y = 2025; y <= 2026; y++) {
                const item = document.createElement('div'); item.className = 'wheel-item'; item.dataset.val = y; item.innerText = y + ' 年'; yearWheel.appendChild(item);
            }
            monthWheel.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const item = document.createElement('div'); item.className = 'wheel-item'; item.dataset.val = m; item.innerText = String(m).padStart(2, '0') + ' 月'; monthWheel.appendChild(item);
            }
            updateDaysWheel(2026, 7, true);
            [yearWheel, monthWheel, dayWheel].forEach(col => {
                bindWheelDragAndClick(col);
                let isTicking = false;
                col.addEventListener('scroll', () => {
                    if (!isTicking) { requestAnimationFrame(() => { updateWheelItemStylesFast(col); isTicking = false; }); isTicking = true; }
                }, { passive: true });
            });
        }

        function bindWheelDragAndClick(colEl) {
            let isMouseDown = false, startY = 0, startScrollTop = 0, isDragged = false;
            colEl.addEventListener('mousedown', (e) => { isMouseDown = true; isDragged = false; startY = e.clientY; startScrollTop = colEl.scrollTop; colEl.style.scrollSnapType = 'none'; });
            window.addEventListener('mousemove', (e) => { if (!isMouseDown) return; const dy = e.clientY - startY; if (Math.abs(dy) > 3) isDragged = true; colEl.scrollTop = startScrollTop - dy; });
            window.addEventListener('mouseup', () => { if (!isMouseDown) return; isMouseDown = false; colEl.style.scrollSnapType = 'y mandatory'; const targetIdx = Math.round(colEl.scrollTop / ITEM_HEIGHT); colEl.scrollTo({ top: targetIdx * ITEM_HEIGHT, behavior: 'smooth' }); });
            colEl.addEventListener('click', (e) => {
                if (isDragged) return;
                const item = e.target.closest('.wheel-item');
                if (item) { const index = Array.from(colEl.children).indexOf(item); if (index !== -1) colEl.scrollTo({ top: index * ITEM_HEIGHT, behavior: 'smooth' }); }
            });
        }

        function updateWheelItemStylesFast(colEl) {
            const currentIdx = colEl.scrollTop / ITEM_HEIGHT;
            const items = colEl.children;
            for (let i = 0; i < items.length; i++) {
                const dist = Math.abs(i - currentIdx) * ITEM_HEIGHT;
                const ratio = Math.min(dist / 80, 1);
                items[i].style.transform = `scale(${(1.05 - ratio * 0.25).toFixed(3)}) translateZ(0)`;
                items[i].style.opacity = (1 - ratio * 0.72).toFixed(3);
            }
        }

        function updateDaysWheel(year, month, forceUpdate = false) {
            const totalDays = new Date(year, month, 0).getDate();
            if (!forceUpdate && totalDays === currentTotalDays) return;
            currentTotalDays = totalDays;
            const currentSelectedDay = getWheelValue(dayWheel) || 28;
            dayWheel.innerHTML = '';
            for (let d = 1; d <= totalDays; d++) {
                const item = document.createElement('div'); item.className = 'wheel-item'; item.dataset.val = d; item.innerText = String(d).padStart(2, '0') + ' 日'; dayWheel.appendChild(item);
            }
            scrollWheelToValue(dayWheel, Math.min(currentSelectedDay, totalDays));
        }

        function getWheelValue(colEl) {
            const index = Math.round(colEl.scrollTop / ITEM_HEIGHT);
            const child = colEl.children[index];
            return child ? parseInt(child.dataset.val) : null;
        }

        function scrollWheelToValue(colEl, val) {
            const items = Array.from(colEl.children);
            const index = items.findIndex(item => parseInt(item.dataset.val) === parseInt(val));
            if (index !== -1) { colEl.scrollTop = index * ITEM_HEIGHT; requestAnimationFrame(() => updateWheelItemStylesFast(colEl)); }
        }

        let wheelScrollTimer = null;
        function handleYearMonthChange() {
            clearTimeout(wheelScrollTimer);
            wheelScrollTimer = setTimeout(() => { updateDaysWheel(getWheelValue(yearWheel) || 2026, getWheelValue(monthWheel) || 7); }, 120);
        }
        yearWheel.addEventListener('scroll', handleYearMonthChange, { passive: true });
        monthWheel.addEventListener('scroll', handleYearMonthChange, { passive: true });
        initWheelPicker();

        // ---------------- 📦 本地 IndexedDB 数据库存储逻辑 ----------------
        let db = null;
        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open("AnimeBirthdayGalleryDB", 1);
                req.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains("photos")) {
                        db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
                    }
                };
                req.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                req.onerror = (e) => reject(e);
            });
        }

        function savePhotoToDB(photoObj) {
            return new Promise((resolve, reject) => {
                if (!db) return reject("数据库未就绪");
                const tx = db.transaction("photos", "readwrite");
                const store = tx.objectStore("photos");
                const req = store.add(photoObj);
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e);
            });
        }

        function getPhotosFromDB() {
            return new Promise((resolve) => {
                if (!db) return resolve([]);
                const tx = db.transaction("photos", "readonly");
                const store = tx.objectStore("photos");
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        }

        initDB().catch(console.error);

        // ---------------- 相册检索与年份匹配 ----------------
        const galleryWrapper = document.getElementById('galleryWrapper');
        const photoGrid = document.getElementById('photoGrid');
        const searchInput = document.getElementById('searchInput');
        const searchSubmitBtn = document.getElementById('searchSubmitBtn');
        const emptyHint = document.getElementById('emptyHint');
        const galleryContent = document.getElementById('galleryContent');

        const lightboxOverlay = document.getElementById('lightboxOverlay');
        const lightboxImg = document.getElementById('lightboxImg');
        const cornerHeartBtn = document.getElementById('cornerHeartBtn');
        const heartLightboxOverlay = document.getElementById('heartLightboxOverlay');

        cornerHeartBtn.addEventListener('click', (e) => { e.stopPropagation(); heartLightboxOverlay.classList.add('show'); });
        heartLightboxOverlay.addEventListener('click', () => heartLightboxOverlay.classList.remove('show'));

        let localPhotosCache = null;

        function isDateMatch(photoDateStr, searchInput) {
            if (!searchInput || !searchInput.trim()) return true;

            let input = searchInput.trim().toLowerCase();
            input = input.replace(/年|月|-/g, '.').replace(/日/g, '');
            const target = photoDateStr.trim().toLowerCase();

            if (target === input) return true;

            if (input.startsWith('25.') || input.startsWith('26.')) {
                return target === input || target.includes(input);
            }

            const default26 = `26.${input}`;
            if (target === default26 || target.endsWith(`.${input}`)) {
                return true;
            }

            return target.includes(input);
        }

        async function executeSearch() {
            const query = searchInput.value;

            galleryWrapper.classList.add('searched');
            galleryContent.style.display = "block";
            photoGrid.innerHTML = "<div style='grid-column: 1/-1; text-align:center; color:#8b5cf6;'>🌸 正在加载回忆照片...</div>";

            try {
                // 1. 获取静态 photos.json 中的照片
                if (!localPhotosCache) {
                    try {
                        const response = await fetch('photos.json');
                        if (response.ok) {
                            localPhotosCache = await response.json();
                        } else {
                            localPhotosCache = [];
                        }
                    } catch (e) {
                        localPhotosCache = [];
                    }
                }

                // 2. 获取浏览器本地直接上传的照片
                const dbPhotos = await getPhotosFromDB();

                // 3. 合并所有照片（本地上传优先放置在前面）
                const allPhotos = [...dbPhotos, ...(localPhotosCache || [])];

                photoGrid.innerHTML = "";
                let filtered = allPhotos.filter(item => isDateMatch(item.date_str, query));

                if (filtered.length === 0) {
                    emptyHint.style.display = "block";
                } else {
                    emptyHint.style.display = "none";
                    filtered.forEach(photo => {
                        const card = document.createElement('div');
                        card.className = 'photo-card';
                        card.innerHTML = `<img src="${photo.img_url}" loading="lazy" alt="回忆照片"><span class="photo-tag">${photo.date_str}</span>`;
                        card.addEventListener('click', (e) => { 
                            e.stopPropagation(); 
                            lightboxImg.src = photo.img_url; 
                            lightboxOverlay.classList.add('show'); 
                        });
                        photoGrid.appendChild(card);
                    });
                }
            } catch (err) {
                console.error(err);
                photoGrid.innerHTML = "<div style='grid-column: 1/-1; text-align:center; color:#e11d48;'>加载失败，请重试</div>";
            }
        }

        searchSubmitBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });
        lightboxOverlay.addEventListener('click', () => lightboxOverlay.classList.remove('show'));
        lightboxImg.addEventListener('click', (e) => e.stopPropagation());

        // ---------------- 📤 弹窗照片选择与保存 ----------------
        const uploadModal = document.getElementById('uploadModal');
        const openUploadModalBtn = document.getElementById('openUploadModalBtn');
        const closeUploadModalBtn = document.getElementById('closeUploadModalBtn');
        const savePhotoBtn = document.getElementById('savePhotoBtn');

        const uploadDropzone = document.getElementById('uploadDropzone');
        const photoFileInput = document.getElementById('photoFileInput');
        const uploadDropzoneText = document.getElementById('uploadDropzoneText');
        const uploadPreviewImg = document.getElementById('uploadPreviewImg');
        let currentSelectedBase64 = null;

        openUploadModalBtn.addEventListener('click', () => uploadModal.classList.add('show'));
        closeUploadModalBtn.addEventListener('click', () => uploadModal.classList.remove('show'));

        uploadDropzone.addEventListener('click', () => photoFileInput.click());

        photoFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentSelectedBase64 = event.target.result;
                    uploadPreviewImg.src = currentSelectedBase64;
                    uploadPreviewImg.style.display = 'block';
                    uploadDropzoneText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // 拖拽文件上传支持
        uploadDropzone.addEventListener('dragover', (e) => { e.preventDefault(); uploadDropzone.style.background = 'rgba(237, 222, 255, 0.95)'; });
        uploadDropzone.addEventListener('dragleave', () => { uploadDropzone.style.background = 'rgba(245, 237, 255, 0.6)'; });
        uploadDropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadDropzone.style.background = 'rgba(245, 237, 255, 0.6)';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentSelectedBase64 = event.target.result;
                    uploadPreviewImg.src = currentSelectedBase64;
                    uploadPreviewImg.style.display = 'block';
                    uploadDropzoneText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // 点击“保存照片”
        savePhotoBtn.addEventListener('click', async () => {
            if (!currentSelectedBase64) {
                alert('请先选择或拖拽一张照片！');
                return;
            }

            const y = getWheelValue(yearWheel) || 2026;
            const m = getWheelValue(monthWheel) || 7;
            const d = getWheelValue(dayWheel) || 28;

            const shortYear = String(y).slice(-2);
            const dateStr = `${shortYear}.${m}.${d}`;

            const photoObj = {
                date_str: dateStr,
                img_url: currentSelectedBase64,
                timestamp: Date.now()
            };

            try {
                await savePhotoToDB(photoObj);
                alert(`🌸 照片保存成功！（对应日期：${dateStr}）`);

                // 重置选择框
                currentSelectedBase64 = null;
                uploadPreviewImg.src = '';
                uploadPreviewImg.style.display = 'none';
                uploadDropzoneText.style.display = 'block';
                photoFileInput.value = '';
                uploadModal.classList.remove('show');

                // 立即刷新页面照片展示
                executeSearch();
            } catch (err) {
                console.error(err);
                alert('保存失败，请稍后重试！');
            }
        });

        // 背景微光粒子生成
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 8 + 4;
            particle.style.width = size + 'px'; particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = (Math.random() * 8) + 's';
            particle.style.animationDuration = (Math.random() * 6 + 6) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
